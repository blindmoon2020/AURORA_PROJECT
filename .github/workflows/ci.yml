name: ci

on:
  push:
    branches: ["aurora-v2", "main", "master"]
    paths:
      - "aurora_v2/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "aurora_v2/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: aurora_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no dependencies)
        run: python -m pip install --upgrade pip
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Baseline backtest runs
        run: python scripts/run_backtest.py --data synthetic --candles 5000 --seed 7
      - name: Guardrails engage
        run: python scripts/run_backtest.py --candles 3000 --seed 3 --dna strategies/ema_cross_eurusd.json
